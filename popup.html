<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YOPmail Checker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="top-bar">
      <div class="address-combo" id="addressCombo">
        <input
          type="text"
          id="addressInput"
          placeholder="hermes.test.e091mc"
          autocomplete="off"
          spellcheck="false"
          aria-autocomplete="list"
          aria-controls="addressList"
        />
        <button id="addressToggle" class="combo-toggle" type="button" aria-label="Saved addresses" aria-haspopup="listbox" aria-expanded="false">▾</button>
        <ul id="addressList" class="combo-list" role="listbox" hidden></ul>
      </div>
      <button id="goBtn" class="btn btn-primary">Go</button>
      <button id="refreshBtn" class="btn btn-secondary">Refresh</button>
      <button id="openTabBtn" class="btn btn-secondary">Open in tab</button>
    </header>

    <div id="hint" class="hint" hidden>
      <span id="hintText">YOPmail may require a human check.</span>
      <button id="hintOpenTab" class="btn-link" type="button">Open in tab</button>
    </div>

    <div class="webmail-wrap">
      <iframe
        id="webmailFrame"
        class="webmail-frame"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation-by-user-activation"
        allow="fullscreen"
      ></iframe>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
